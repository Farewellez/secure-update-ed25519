[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-update-ed25519-demo"
version = "0.1.0"
description = "Educational signed update distribution demo using Ed25519, SHA-256, and anti-rollback"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42,<48",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["secure_update*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
